name: Build Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: build-win.bat
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecklessDrivin-Windows
          path: dist/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x build-mac.sh
          ./build-mac.sh

      - name: Package app bundle
        run: cd build-mac && zip -r ../RecklessDrivin-macOS.zip RecklessDrivin.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecklessDrivin-macOS
          path: RecklessDrivin-macOS.zip
